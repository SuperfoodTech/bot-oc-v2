    {# ── TAB PANE 1: OPERASIONAL OUTLET ── #}
    <div class="tab-pane" :class="{ 'active': currentTab === 'outlets' }" id="paneOutlets">
      <div class="table-card outlet-section">
        <div class="table-heading">
          <div class="table-heading-title">
            <h2>Daftar outlet</h2>
            <span class="bot-status-badge" id="daemonStatusVal" title="Status sinkronisasi bot">Memuat...</span>
          </div>
          <div class="table-heading-actions">
            <input type="text" id="searchInput" class="form-input table-search" placeholder="Cari mitra, outlet, atau Store ID" onkeyup="filterTable()">
            <button class="btn-primary btn-compact" type="button" id="fetchSheetButton" onclick="fetchSheetData()">Fetch dari Sheet</button>
          </div>
        </div>

        <div class="table-scroll d-none d-md-block">
          <table class="data-table" id="adminTable">
            <thead>
              <tr>
                <th>Nama Pemilik</th>
                <th>Merchant Name</th>
                <th>Store ID</th>
                <th>Nama Panjang Outlet</th>
                <th>Link User Vercel</th>
                <th>Status utama</th>
                <th>Tanggal Berakhir Layanan</th>
                <th>Status akun</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="9" class="table-loading-state">Memuat data outlet...</td></tr>
            </tbody>
          </table>
        </div>

        <div id="mobileOutletList" class="mobile-outlet-list d-md-none">
          <div class="mobile-empty-state">Memuat data outlet...</div>
        </div>
      </div>
    </div>
