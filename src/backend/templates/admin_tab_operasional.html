    {# ── TAB PANE 1: OPERASIONAL OUTLET ── #}
    <div class="tab-pane" :class="{ 'active': currentTab === 'outlets' }" id="paneOutlets">
      <div class="stats-grid" aria-label="Ringkasan outlet">
        <article class="metric-card metric-card-total"><div class="metric-card-icon"><img src="/static/icons/shop-svgrepo-com.svg" alt=""></div><div class="metric-card-content"><span class="metric-card-label">Total Outlet</span><strong id="metricTotal">0</strong></div></article>
        <article class="metric-card metric-card-open"><div class="metric-card-icon"><img src="/static/icons/open-svgrepo-com.svg" alt=""></div><div class="metric-card-content"><span class="metric-card-label">Sedang Buka</span><strong id="metricOpen">0</strong></div></article>
        <article class="metric-card metric-card-closed"><div class="metric-card-icon"><img src="/static/icons/closed-svgrepo-com.svg" alt=""></div><div class="metric-card-content"><span class="metric-card-label">Sedang Tutup</span><strong id="metricClosed">0</strong></div></article>
        <article class="metric-card metric-card-subscription"><div class="metric-card-icon"><img src="/static/icons/crown-svgrepo-com.svg" alt=""></div><div class="metric-card-content"><span class="metric-card-label">Subscription Aktif</span><strong id="metricSubscription">0</strong></div></article>
      </div>
      <div class="outlet-filter-card">
        <div class="table-heading">
          <div class="table-heading-actions">
            <div class="outlet-filter-toolbar">
              <label class="filter-field"><span>Nama pemilik</span><select id="ownerFilter" class="form-input filter-select" aria-label="Filter nama pemilik" onchange="filterTable()"><option value="">Semua pemilik</option></select></label>
              <label class="filter-field"><span>Nama outlet</span><select id="outletFilter" class="form-input filter-select" aria-label="Filter nama outlet" onchange="filterTable()"><option value="">Semua outlet</option></select></label>
              <label class="filter-field"><span>Store ID</span><select id="storeIdFilter" class="form-input filter-select" aria-label="Filter Store ID" onchange="filterTable()"><option value="">Semua Store ID</option></select></label>
              <label class="filter-field"><span>Status</span><select id="statusFilter" class="form-input filter-select" aria-label="Filter status" onchange="filterTable()"><option value="">Semua status</option><option value="open">Open</option><option value="paused">Paused</option></select></label>
              <label class="filter-field"><span>Subscription</span><select id="subscriptionFilter" class="form-input filter-select" aria-label="Filter subscription" onchange="filterTable()"><option value="">Semua subscription</option><option value="active">Aktif</option><option value="expired">Expired</option></select></label>
              <label class="filter-field"><span>Paket</span><select id="packageFilter" class="form-input filter-select" aria-label="Filter paket" onchange="filterTable()"><option value="">Semua paket</option></select></label>
              <button class="btn-outline btn-compact reset-filter-button" type="button" onclick="resetOutletFilters()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v5h5"/><path d="M5.5 10A7 7 0 1 1 6 16"/></svg>Reset filter</button>
            </div>
          </div>
        </div>
      </div>
      <div class="outlet-content-layout">
      <div class="table-card outlet-section">
        <div class="table-scroll d-none d-md-block">
          <table class="data-table" id="adminTable">
            <thead>
              <tr>
                <th>Owner</th>
                <th>Merchant</th>
                <th>Store ID</th>
                <th>Outlet</th>
                <th>Jam Operasional</th>
                <th>Status</th>
                <th>Action</th>
                <th>Periode Layanan</th>
                <th>Toggle</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="9" class="table-loading-state">Memuat data outlet...</td></tr>
            </tbody>
          </table>
        </div>

        <div id="mobileOutletList" class="mobile-outlet-list d-md-none">
          <div class="mobile-empty-state">Memuat data outlet...</div>
        </div>
      </div>
      <aside class="outlet-detail-panel" id="outletDetailPanel" aria-labelledby="outletDetailTitle" hidden>
        <div class="outlet-detail-panel-head">
          <h2 id="outletDetailTitle">Detail Outlet</h2>
          <div class="outlet-detail-panel-actions">
            <button type="button" class="outlet-detail-close" onclick="closeOutletDetail()" aria-label="Tutup detail outlet">×</button>
          </div>
        </div>
        <div id="outletDetailContent"></div>
      </aside>
      <div class="outlet-detail-backdrop" id="outletDetailBackdrop" onclick="closeOutletDetail()" hidden></div>
      </div>
    </div>
