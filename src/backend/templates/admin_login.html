<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk | FoodMaster Admin</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=20260818-login-box-sizing">
</head>

<body class="admin-login-page">
  <main class="admin-login-shell">
    <section class="admin-login-card">
      <div class="step-indicator">FoodMaster Admin</div>
      <h1>Masuk ke dashboard</h1>
      <form id="adminLoginForm">
        <label for="adminUsername">Username</label>
        <input id="adminUsername" class="form-input" autocomplete="username" required>
        <label for="adminPassword">Password</label>
        <div class="password-field">
          <input id="adminPassword" class="form-input" type="password" autocomplete="current-password" required>
          <button id="toggleAdminPassword" class="password-visibility-toggle" type="button"
            aria-label="Tampilkan password" aria-pressed="false">
            <svg class="password-icon password-icon-show" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.4-5 9.5-5 9.5 5 9.5 5-3.4 5-9.5 5-9.5-5-9.5-5Z" />
              <circle cx="12" cy="12" r="2.5" />
            </svg>
            <svg class="password-icon password-icon-hide is-hidden" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="m3 3 18 18M10.6 6.9A10.9 10.9 0 0 1 12 7c6.1 0 9.5 5 9.5 5a17 17 0 0 1-3.1 3.3M6.2 6.2C3.9 7.8 2.5 12 2.5 12s3.4 5 9.5 5c1.2 0 2.3-.2 3.2-.6" />
            </svg>
          </button>
        </div>
        <p id="adminLoginError" class="admin-login-error" role="alert"></p>
        <button class="btn-primary admin-login-submit" type="submit">Masuk</button>
        <div class="google-auth-option" style="display: none;">
          <div class="login-divider">ATAU</div>
          <button type="button" class="btn-google" id="googleLoginBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
            Masuk dengan Google
          </button>
        </div>
      </form>
    </section>
  </main>
  <script>
    const adminPasswordInput = document.getElementById('adminPassword');
    const toggleAdminPassword = document.getElementById('toggleAdminPassword');
    toggleAdminPassword.addEventListener('click', () => {
      const isVisible = adminPasswordInput.type === 'text';
      adminPasswordInput.type = isVisible ? 'password' : 'text';
      toggleAdminPassword.setAttribute('aria-pressed', String(!isVisible));
      toggleAdminPassword.setAttribute('aria-label', isVisible ? 'Tampilkan password' : 'Sembunyikan password');
      document.querySelector('.password-icon-show').classList.toggle('is-hidden', !isVisible);
      document.querySelector('.password-icon-hide').classList.toggle('is-hidden', isVisible);
    });

    document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('adminLoginError');
      error.textContent = '';
      const response = await fetch('/api/v1/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('adminUsername').value,
          password: document.getElementById('adminPassword').value
        })
      });
      if (response.ok) {
        window.location.href = '/admin';
        return;
      }
      const data = await response.json().catch(() => ({}));
      error.textContent = data.detail || 'Login gagal. Periksa kembali username dan password.';
    });

    // Google Sign-In redirect
    document.getElementById('googleLoginBtn').addEventListener('click', () => {
      window.location.href = `/api/v1/auth/google/login?role=admin&state_url=${encodeURIComponent(window.location.pathname)}`;
    });

    // Check for error in query string
    const urlParams = new URLSearchParams(window.location.search);
    const errorParam = urlParams.get('error');
    if (errorParam) {
      const errorEl = document.getElementById('adminLoginError');
      if (errorParam === 'email_not_registered') {
        const email = urlParams.get('email') || '';
        errorEl.textContent = `Email Google Anda (${email}) belum terdaftar sebagai Admin. Silakan hubungi CS/Superadmin.`;
      } else if (errorParam === 'unauthorized_role') {
        errorEl.textContent = 'Email Google Anda tidak memiliki akses ke Dashboard Admin.';
      } else {
        errorEl.textContent = 'Masuk dengan Google gagal. Silakan coba lagi.';
      }
    }
  </script>
</body>
</html>
