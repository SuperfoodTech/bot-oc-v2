    {# ── TAB PANE 3: SETTINGS ── #}
    <div class="tab-pane" :class="{ 'active': currentTab === 'settings' }" id="paneSettings">
      <div class="settings-card">
        <div class="step-indicator">Admin account</div>
        <h2>Pengaturan admin</h2>
        <p class="card-subtitle">Kelola sesi akses untuk dashboard operasional FoodMaster.</p>
        <div class="settings-account-row">
          <div>
            <span class="settings-label">Login sebagai</span>
            <strong id="currentAdminUsername">Memuat akun...</strong>
          </div>
          <span class="settings-role">ADMIN</span>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">Akun saya</div>
          <div class="settings-form-grid">
            <div class="settings-field"><label for="settingsUsername">Username baru</label><input id="settingsUsername" class="form-input" aria-label="Username baru" autocomplete="username"></div>
            <div class="settings-field"><label for="settingsPassword">Password baru</label><input id="settingsPassword" class="form-input" type="password" aria-label="Password baru" autocomplete="new-password" placeholder="Biarkan kosong jika tidak diubah"></div>
          </div>
          <button class="btn-primary" type="button" onclick="updateAdminAccount()">Simpan perubahan</button>
          <p id="settingsAccountMessage" class="settings-message" role="status"></p>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">Tambahkan admin</div>
          <div class="settings-form-grid">
            <div class="settings-field"><label for="newAdminUsername">Username</label><input id="newAdminUsername" class="form-input" aria-label="Username admin baru" autocomplete="off"></div>
            <div class="settings-field"><label for="newAdminPassword">Password</label><input id="newAdminPassword" class="form-input" type="password" aria-label="Password admin baru" autocomplete="new-password"></div>
          </div>
          <button class="btn-outline" type="button" onclick="createAdminAccount()">Tambahkan role admin</button>
          <p id="newAdminMessage" class="settings-message" role="status"></p>
        </div>
        <div class="settings-section">
          <div class="settings-section-title">Admin terdaftar</div>
          <div id="adminAccountList" class="admin-account-list">Memuat akun admin...</div>
        </div>
        <button class="btn-primary" type="button" onclick="logoutAdmin()">Keluar dari dashboard</button>
      </div>
    </div>
