services:
  db:
    image: postgres:16-alpine
    container_name: fm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodmaster}
      POSTGRES_USER: ${POSTGRES_USER:-foodmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fm-backend
    restart: always
    depends_on:
      db:
        condition: service_started
    ports:
      - "3001:3001"
    environment:
      - ENVIRONMENT=development
      - PORT=3001
      - APP_BASE_URL=http://localhost:3001
      - ALLOWED_USERNAMES=auto7313
      - DATABASE_URL=postgresql://${POSTGRES_USER:-foodmaster}:${POSTGRES_PASSWORD:-change-me-in-env}@db:5432/${POSTGRES_DB:-foodmaster}
      - SHOPEE_BOT_USERNAME=auto7313
      - SHOPEE_BOT_PASSWORD=Auto@7313
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TZ=Asia/Jakarta
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_SHEETS_CSV_URL=${GOOGLE_SHEETS_CSV_URL}
      - GOOGLE_SHEETS_APPS_SCRIPT_URL=${GOOGLE_SHEETS_APPS_SCRIPT_URL}
      - GOOGLE_SHEETS_APPS_SCRIPT_TOKEN=${GOOGLE_SHEETS_APPS_SCRIPT_TOKEN}
      - GOOGLE_AUTH_ENABLED=${GOOGLE_AUTH_ENABLED:-false}
    volumes:
      - ./src:/app/src

  bot:
    build:
      context: .
      dockerfile: main-bot/Dockerfile
    image: foodmaster-bot-runtime:dev
    container_name: fm-bot
    restart: always
    depends_on:
      db:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-foodmaster}:${POSTGRES_PASSWORD:-change-me-in-env}@db:5432/${POSTGRES_DB:-foodmaster}
      - SHOPEE_BOT_USERNAME=auto7313
      - SHOPEE_BOT_PASSWORD=Auto@7313
      - ALLOWED_USERNAMES=auto7313
      - HEADLESS=${HEADLESS:-true}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TZ=Asia/Jakarta
    volumes:
      - ./src/data:/app/src/data
      - ./src:/app/src
      - ./credentials.json:/app/credentials.json

  bot-vb:
    build:
      context: .
      dockerfile: main-bot/Dockerfile
    image: foodmaster-bot-runtime:dev
    container_name: fm-bot-vb
    restart: always
    depends_on:
      db:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-foodmaster}:${POSTGRES_PASSWORD:-change-me-in-env}@db:5432/${POSTGRES_DB:-foodmaster}
      - PYTHONPATH=/app/main-vb/src:/app/src
      - HEADLESS=${HEADLESS:-true}
      - VB_SESSION_FILE=/app/vb-data/session.json
      - VB_CREDENTIALS_FILE=/app/vb-data/credentials.json
      - VB_CHROME_PROFILE_DIR=/app/vb-data/chrome_profile
      - VB_CHROME_PROFILE_NAME=shopee_profile
      - VB_PATROL_INTERVAL_SECONDS=30
      - VB_MAX_RETRIES=2
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
      - CHROME_BIN=/usr/bin/chromium
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TZ=Asia/Jakarta
    command: ["uv", "run", "python", "main-vb/src/daemon.py"]
    volumes:
      - ./src/data:/app/vb-data
      - ./src/data/credentials allvbadmin.json:/app/vb-data/credentials.json:ro

volumes:
  postgres_data:
