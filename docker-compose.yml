services:
  db:
    image: postgres:16-alpine
    container_name: fm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodmaster}
      POSTGRES_USER: ${POSTGRES_USER:-foodmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fm-backend
    restart: always
    depends_on:
      db:
        condition: service_started
    ports:
      - "3001:3001"
    environment:
      - ENVIRONMENT=development
      - PORT=3001
      - APP_BASE_URL=http://localhost:3001
      - ALLOWED_USERNAMES=auto7313
      - DATABASE_URL=postgresql://${POSTGRES_USER:-foodmaster}:${POSTGRES_PASSWORD:-change-me-in-env}@db:5432/${POSTGRES_DB:-foodmaster}
      - SHOPEE_BOT_USERNAME=auto7313
      - SHOPEE_BOT_PASSWORD=Auto@7313
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TZ=Asia/Jakarta
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
    volumes:
      - ./src:/app/src

  bot:
    build:
      context: .
      dockerfile: main-bot/Dockerfile
    container_name: fm-bot
    restart: always
    depends_on:
      db:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-foodmaster}:${POSTGRES_PASSWORD:-change-me-in-env}@db:5432/${POSTGRES_DB:-foodmaster}
      - SHOPEE_BOT_USERNAME=auto7313
      - SHOPEE_BOT_PASSWORD=Auto@7313
      - ALLOWED_USERNAMES=auto7313
      - HEADLESS=true
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TZ=Asia/Jakarta
    volumes:
      - ./src/data:/app/src/data
      - ./src:/app/src
      - ./credentials.json:/app/credentials.json

volumes:
  postgres_data:
