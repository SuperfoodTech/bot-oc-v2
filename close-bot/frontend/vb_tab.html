<section class="vb-pane" aria-labelledby="vb-title">
  <div class="vb-heading">
    <div>
      <p class="vb-eyebrow">Virtual Brand</p>
      <h1 id="vb-title">Daftar Brand</h1>
      <p class="vb-description">
        Satu status mengendalikan seluruh outlet yang terhubung pada brand.
      </p>
    </div>
    <div class="vb-heading-actions">
      <label class="vb-search-label" for="vb-search">Cari brand</label>
      <input id="vb-search" class="vb-search" type="search" placeholder="Nama brand">
    </div>
  </div>

  <div class="vb-table-card">
    <div class="vb-table-scroll">
      <table class="vb-table">
        <thead>
          <tr>
            <th scope="col">Brand</th>
            <th scope="col">Merchant</th>
            <th scope="col">Outlet</th>
            <th scope="col">Status kontrol</th>
            <th scope="col">Sinkronisasi terakhir</th>
          </tr>
        </thead>
        <tbody id="vb-brand-list">
          <tr>
            <td colspan="5" class="vb-empty-state">
              Data brand belum dimuat.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
